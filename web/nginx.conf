# web: static SPA from dist plus reverse proxy to api:8000.
# Runs as the unprivileged nginx user on a read-only root; everything writable lives in /tmp
# (tmpfs in compose), including request bodies buffered on their way to the API (hard rule 3).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Traffic arrives through Cloudflare Tunnel (cloudflared -> 127.0.0.1:8080 -> docker), so the
    # peer is always a local or docker-bridge address. Trust CF-Connecting-IP only from those.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Method, path, status and timing only: no bodies, no query strings, no upload filenames.
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time';
    access_log /dev/stdout main;

    # Uploads: 10 POSTs per minute per client IP, a small burst served at once, the rest get 429.
    # Requests with an empty key (anything but POST) are not counted.
    map $request_method $upload_key {
        POST $binary_remote_addr;
        default "";
    }
    limit_req_zone $upload_key zone=upload:10m rate=10r/m;
    limit_req_status 429;

    # The SPA only loads its own bundles and /examples/*.json. React sets inline styles through
    # the CSSOM and jsonata needs no eval, so 'self' is enough. Swagger UI (/docs) pulls its
    # assets from a CDN, so it gets no CSP here; an empty value means no header.
    map $uri $csp {
        /docs "";
        default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }

    # Hashed bundles never change under the same name; index.html must be revalidated.
    map $uri $cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/(api/|health$|docs$|openapi\.json$) "";
        default "no-cache";
    }

    map $status $retry_after {
        429 60;
        default "";
    }

    upstream api {
        server api:8000;
        keepalive 8;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;

        # MAX_UPLOAD_MB is 20; the margin covers multipart framing. The API checks the exact limit.
        client_max_body_size 25m;
        client_body_buffer_size 1m;
        client_body_timeout 60s;

        # Above REQUEST_TIMEOUT_S (300 s) so the API answers first, with its own 504.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;

        # Only here: any add_header inside a location would drop all of these.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control $cache_control always;
        add_header Retry-After $retry_after always;

        error_page 413 = @too_large;
        error_page 429 = @rate_limited;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://api;
        }

        location = /health {
            proxy_pass http://api;
        }

        location = /docs {
            proxy_pass http://api;
        }

        location = /openapi.json {
            proxy_pass http://api;
        }

        location /assets/ {
            try_files $uri =404;
        }

        # `/`, `/podglad` and any other client-side path fall back to index.html.
        location / {
            try_files $uri /index.html;
        }

        # problem+json for errors raised by nginx itself, matching the API's error format.
        location @too_large {
            default_type application/problem+json;
            return 413 '{"type":"about:blank","title":"Plik za duży","status":413,"detail":"Plik przekracza dopuszczalny rozmiar."}';
        }

        location @rate_limited {
            default_type application/problem+json;
            return 429 '{"type":"about:blank","title":"Za dużo żądań","status":429,"detail":"Przekroczono limit przesyłanych plików. Spróbuj ponownie za minutę."}';
        }
    }
}
