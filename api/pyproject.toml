[project]
name = "formcompiler"
version = "0.1.0"
description = "Blankiet formularza urzędowego -> JSON konfiguracji formularza COI"
authors = [
    { name = "Adimac93", email = "adimac93@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "olefile>=0.47",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
